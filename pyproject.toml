[project]
name = "google-news-headlines"
version = "0.1.0"
description = "Collect Google News headlines for specified countries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "news-scraper",
    "pandas>=2.3.3",
    "playwright>=1.58.0",
    "requests>=2.32.5",
]

[tool.uv.workspace]
members = [
    "lib",
]

[tool.uv.sources]
news-scraper = { workspace = true, editable = true }
