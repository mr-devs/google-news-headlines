[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-scraper"
version = "0.1.0"
description = "Google News headline scraping utilities"
authors = [{name = "Matthew DeVerna"}]
requires-python = ">=3.8"
dependencies = [
    "requests",
    "beautifulsoup4",
]

[tool.setuptools]
py-modules = ["news_scraper"]
